<meta charset="utf-8">
<title>Карта Ойкумены</title>
<meta name="description" content="Интерактивная карта мира Ойкумены, Весна 119 г. от Кары богов">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+SC:wght@500;600;700&family=Alegreya+Sans:ital,wght@0,400;0,500;0,700;1,400&display=swap">
<style>
/* Layout: карта на весь экран; слева сверху шапка и поиск, справа выезжает панель владения (на телефоне снизу). Один тёмный образ по мотивам карты Рунтерры. */
:root{
  --abyss:#070d18;          /* фон за картой, море */
  --panel:#0c1626;          /* панель */
  --panel-2:#12203a;        /* поднятые поверхности */
  --gold:#c8aa6e;           /* главный акцент, рамки и заголовки */
  --gold-dim:#7a6644;       /* линии, разделители */
  --ice:#8fc9dc;            /* второй акцент: выделение, фокус */
  --text:#ece4d2;
  --muted:#93a0b6;
  --font-display:"Cormorant SC","Cormorant Garamond",Georgia,"Times New Roman",serif;
  --font-body:"Alegreya Sans","Segoe UI",system-ui,sans-serif;
  --panel-w:min(420px,100vw);
  color-scheme:dark;
}
html,body{height:100%}
body{margin:0;background:var(--abyss);color:var(--text);font-family:var(--font-body);font-size:15px;line-height:1.5;overflow:hidden}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ice);outline-offset:2px}

#stage{position:fixed;inset:0;overflow:hidden;touch-action:none;cursor:grab;background:
  radial-gradient(ellipse at 30% 20%,#0f1d33 0,transparent 60%),var(--abyss)}
#stage.dragging{cursor:grabbing}
#world{position:absolute;left:0;top:0;width:2035px;height:4096px;transform-origin:0 0;will-change:transform}
#world img.layer{position:absolute;left:0;top:0;width:2035px;height:4096px;max-width:none;user-select:none;-webkit-user-drag:none;pointer-events:none;transition:opacity .35s}
#hl{position:absolute;left:0;top:0;width:2032px;height:4096px;pointer-events:none;filter:blur(1.2px)}

.mk{position:absolute;width:0;height:0}
.mk button{position:absolute;left:0;top:0;width:28px;height:28px;margin:-14px 0 0 -14px;border-radius:50%;border:0;background:transparent;cursor:pointer;
  transform:scale(var(--inv,1));transform-origin:50% 50%;padding:0}
.mk button::after{content:"";position:absolute;inset:7px;border-radius:50%;border:2px solid var(--gold);background:rgba(7,13,24,.35);
  box-shadow:0 0 0 1px rgba(7,13,24,.7);opacity:0;transition:opacity .15s,inset .15s}
#stage.show-mk .mk button::after{opacity:.85}
.mk button:hover::after,.mk button:focus-visible::after,.mk.sel button::after{opacity:1;inset:4px;border-color:var(--ice);box-shadow:0 0 12px var(--ice)}
.mk.cap button::after{border-width:2.5px}

.rlabel{position:absolute;width:0;height:0;pointer-events:none}
.rlabel>div{position:absolute;transform:translate(-50%,-50%) scale(var(--inv,1));display:flex;flex-direction:column;align-items:center;gap:4px;
  opacity:0;transition:opacity .2s}
.rlabel.on>div{opacity:1}
.rlabel span{font-family:var(--font-display);font-weight:700;font-size:22px;letter-spacing:.12em;color:#fff;white-space:nowrap;
  text-shadow:0 0 6px #000,0 0 14px #000,0 2px 2px #000}
.rlabel small{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--gold);text-shadow:0 0 6px #000,0 0 4px #000;white-space:nowrap}

/* Шапка */
#top{position:fixed;left:16px;top:calc(16px + env(safe-area-inset-top,0px));display:flex;flex-direction:column;gap:10px;z-index:5;max-width:calc(100vw - 32px);width:300px}
.brand{background:linear-gradient(180deg,rgba(12,22,38,.94),rgba(12,22,38,.86));border:1px solid var(--gold-dim);padding:12px 16px 10px;position:relative}
.brand h1{margin:0;font-family:var(--font-display);font-weight:700;font-size:28px;line-height:1;letter-spacing:.14em;color:var(--gold)}
.brand p{margin:4px 0 0;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}
.search{position:relative}
.search input{width:100%;box-sizing:border-box;background:rgba(12,22,38,.94);border:1px solid var(--gold-dim);color:var(--text);padding:9px 12px;font:inherit;font-size:14px}
.search input::placeholder{color:var(--muted)}
.search input:focus{border-color:var(--ice);outline:none}
#results{position:absolute;left:0;right:0;top:100%;margin:2px 0 0;padding:0;list-style:none;background:var(--panel);border:1px solid var(--gold-dim);max-height:50vh;overflow:auto}
#results li button{display:flex;justify-content:space-between;gap:10px;width:100%;text-align:left;background:none;border:0;padding:8px 12px;cursor:pointer}
#results li button:hover,#results li button:focus-visible{background:var(--panel-2)}
#results small{color:var(--muted);white-space:nowrap}
.toggles{display:flex;gap:0;border:1px solid var(--gold-dim);background:rgba(12,22,38,.94);width:max-content;max-width:100%;flex-wrap:wrap}
.toggles button{background:none;border:0;padding:6px 12px;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);cursor:pointer}
.toggles button[aria-pressed="true"]{color:var(--abyss);background:var(--gold)}

/* Масштаб */
#scale{position:fixed;left:16px;background:rgba(12,22,38,.8);padding:6px 10px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:4;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--text);
  text-shadow:0 0 4px #000;display:flex;flex-direction:column;gap:4px;pointer-events:none}
#scale i{display:block;height:6px;border:1.5px solid var(--gold);border-top:0}
#zoom{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:4;display:flex;flex-direction:column;border:1px solid var(--gold-dim);background:rgba(12,22,38,.94)}
#zoom button{width:38px;height:38px;background:none;border:0;cursor:pointer;font-size:20px;color:var(--gold)}
#zoom button+button{border-top:1px solid var(--gold-dim)}

/* Карточка при наведении */
#hover{position:fixed;z-index:6;pointer-events:none;min-width:200px;max-width:280px;padding:12px 14px;background:linear-gradient(160deg,rgba(18,32,58,.97),rgba(7,13,24,.97));
  border:1px solid var(--gold-dim);box-shadow:0 8px 30px rgba(0,0,0,.6)}
#hover h3{margin:0;font-family:var(--font-display);font-size:21px;line-height:1.1;letter-spacing:.06em;color:var(--text)}
#hover p{margin:3px 0 0;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
#hover .faces{margin-top:10px}

/* Портреты */
.faces{display:flex;gap:6px;flex-wrap:wrap}
.face{width:38px;height:38px;display:grid;place-items:center;border:1px solid var(--gold-dim);background:linear-gradient(160deg,var(--panel-2),var(--abyss));
  font-family:var(--font-display);font-weight:700;font-size:15px;color:var(--gold);letter-spacing:.02em}
.face img{width:100%;height:100%;object-fit:cover;display:block}
.face.pic{padding:0;overflow:hidden;border-color:var(--gold)}
.phead img.arms,.rlabel img.arms{flex:none;border-radius:50%;box-shadow:0 0 0 3px var(--gold),0 3px 8px rgba(0,0,0,.6)}
.house li{display:flex;gap:10px;align-items:flex-start}
.house li .face{flex:none;width:44px;height:44px}
.face.more{color:var(--muted);font-family:var(--font-body);font-size:12px;font-weight:500}

/* Панель */
#panel{position:fixed;top:0;right:0;bottom:0;width:var(--panel-w);z-index:7;background:var(--panel);border-left:1px solid var(--gold-dim);
  box-shadow:-20px 0 50px rgba(0,0,0,.5);transform:translateX(102%);transition:transform .3s ease;display:flex;flex-direction:column}
#panel.open{transform:none}
#panel .close{position:absolute;left:-17px;top:50%;width:32px;height:32px;margin-top:-16px;transform:rotate(45deg);background:var(--panel);border:1px solid var(--gold);cursor:pointer;padding:0}
#panel .close span{display:block;transform:rotate(-45deg);color:var(--gold);font-size:18px;line-height:30px}
#pbody{overflow:auto;padding:0 24px calc(28px + env(safe-area-inset-bottom,0px));flex:1;min-height:0}
.phead{margin:0 -24px;padding:calc(28px + env(safe-area-inset-top,0px)) 24px 18px;display:flex;gap:16px;align-items:center;
  background:linear-gradient(180deg,var(--tint,rgba(200,170,110,.18)),transparent 90%)}
.phead svg{flex:none;width:64px;height:76px;filter:drop-shadow(0 3px 6px rgba(0,0,0,.6))}
.phead h2{margin:0;font-family:var(--font-display);font-weight:700;font-size:30px;line-height:1.02;letter-spacing:.06em;text-wrap:balance}
.phead p{margin:6px 0 0;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
.rule{height:1px;background:var(--gold-dim);margin:18px 0;position:relative}
.rule::before,.rule::after{content:"";position:absolute;top:-3px;width:7px;height:7px;transform:rotate(45deg);background:var(--panel);border:1px solid var(--gold-dim)}
.rule::before{left:-4px}.rule::after{right:-4px}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:14px 18px;margin:0}
.facts div{min-width:0}
.facts dt{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.facts dd{margin:2px 0 0;font-weight:700;text-transform:uppercase;font-size:13px;letter-spacing:.05em;overflow-wrap:anywhere}
.facts dd button{all:unset;cursor:pointer;color:var(--gold);border-bottom:1px solid var(--gold-dim)}
.facts dd button:hover{color:var(--ice)}
.facts dd button:focus-visible{outline:2px solid var(--ice)}
.desc{margin:0;max-width:65ch}
.sec h4{margin:0 0 8px;font-family:var(--font-display);font-size:19px;letter-spacing:.08em;color:var(--gold);font-weight:600}
.chron{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px}
.chron li{display:grid;grid-template-columns:3.2em 1fr;gap:8px}
.chron b{color:var(--gold);font-variant-numeric:tabular-nums}
.house{border-top:1px solid rgba(122,102,68,.45);padding:12px 0}
.house:first-of-type{border-top:0;padding-top:0}
.house h5{margin:0;font-size:15px;font-weight:700;display:flex;gap:8px;align-items:center}
.house h5 img.harms{flex:none;border-radius:50%;box-shadow:0 0 0 1.5px var(--gold)}
.phead.art{background:linear-gradient(90deg,rgba(12,22,38,.96) 30%,rgba(12,22,38,.55)),var(--art) right center/cover no-repeat;min-height:110px}
.house p{margin:4px 0 0;color:var(--muted);font-size:14px}
.house ul{margin:8px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px;font-size:14px}
.house li b{color:var(--text)}
.house li span{color:var(--muted)}
.more{display:inline-flex;gap:6px;align-items:center;background:none;border:0;padding:0;color:var(--ice);cursor:pointer;font-size:14px;letter-spacing:.04em}
.more:hover{text-decoration:underline}
.src{font-size:12px;color:var(--muted);margin-top:18px}
.note{font-size:13px;color:var(--muted);font-style:italic}

@media (max-width:640px){
  #panel{top:auto;left:0;width:auto;height:60%;border-left:0;border-top:1px solid var(--gold-dim);transform:translateY(102%)}
  #panel .close{left:50%;top:-17px;margin:0 0 0 -16px}
  .phead{padding-top:26px}
  #top{width:auto;right:16px}
  .brand h1{font-size:22px}
  #zoom{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div id="stage" class="show-mk" aria-label="Карта Ойкумены">
  <div id="world">
    <img class="layer" id="imgBase" src="base.jpg" alt="Политическая карта Ойкумены">
    <img class="layer" id="imgPhys" src="phys.jpg" alt="" style="opacity:0">
    <canvas id="hl" width="508" height="1024"></canvas>
    <div id="labels"></div>
    <div id="markers"></div>
  </div>
</div>

<header id="top">
  <div class="brand">
    <h1>ОЙКУМЕНА</h1>
    <p>Весна 119 г. от Кары богов</p>
  </div>
  <div class="search">
    <label for="q" hidden>Поиск</label>
    <input id="q" type="search" placeholder="Найти город, владение, правителя" autocomplete="off">
    <ul id="results" hidden></ul>
  </div>
  <div class="toggles" role="group" aria-label="Слои">
    <button id="tPol" aria-pressed="true">Владения</button>
    <button id="tPhys" aria-pressed="false">Рельеф</button>
    <button id="tMk" aria-pressed="true">Метки</button>
  </div>
</header>

<div id="scale" aria-hidden="true"><span id="scaleTxt">100 км</span><i id="scaleBar"></i></div>
<div id="zoom"><button id="zIn" aria-label="Приблизить">+</button><button id="zOut" aria-label="Отдалить">−</button></div>

<div id="hover" hidden></div>

<aside id="panel" aria-label="Сведения" aria-hidden="true">
  <button class="close" id="pClose" aria-label="Свернуть панель"><span>›</span></button>
  <div id="pbody"></div>
</aside>

<script src="data.js" charset="utf-8"></script>
<script>
(function(){
const D=window.OIK, MW=D.map.w, MH=D.map.h, MS=D.map.maskScale;
const $=s=>document.querySelector(s);
const stage=$('#stage'), world=$('#world');
const stateById=Object.fromEntries(D.states.map(s=>[s.id,s]));
const provByRid=Object.fromEntries(D.provinces.map(p=>[p.rid,p]));
const setByName=Object.fromEntries(D.settlements.map(s=>[s.name,s]));
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const dash=v=>(!v||v==='—')?'—':v;

/* ---------- Портреты и гербы-картинки (из сводки персонажей) ---------- */
const PORTRAITS=[[/Олаф Сард/,'img/p-olaf-sard.jpg'],[/Юсти(на|ана).*Калифакт/,'img/p-yustiana-kalifakt.jpg'],[/Амала Сард/,'img/p-amala-sard.jpg'],[/Тересия Сард/,'img/p-teresiya-sard.jpg'],[/Торисмунд Амм?ал/,'img/p-torismund-amal.jpg'],[/Елена Васильева/,'img/p-elena-vasileva.jpg'],[/Лагерта/,'img/p-lagerta-tebriksdotter.jpg'],[/Хродгар Сакс/,'img/p-hrodgar-saks.jpg']];
const portrait=n=>{const p=PORTRAITS.find(([r])=>r.test(n));return p?p[1]:null};
const ARMS_IMG={'Хеортания':'img/arms-sardy.png','Аммалингия':'img/arms-sardy.png', // герб дома Сардов
  'Данники_Турана':'img/arms-ammaly-arirhail.png', // герб Аммалов из Арирхайла (со слов Nerissa)
  'Северные_Владыки':'img/arms-vasilevy.png', // герб рода Васильевых
  'Хиндъяльф':'img/arms-vasilevy.png', // Хиндъяльф в Северной Империи, тот же герб (со слов Nerissa)
  'Империя':'img/arms-imperiya.png'}; // герб Империи (орёл с эмблемы)
const HOUSE_ARMS=[[/^Племя Сардов/,'img/arms-sardy.png'],[/^Аммалы из Арирхайла/,'img/arms-ammaly-arirhail.png'],[/^Род Васильевых/,'img/arms-vasilevy.png'],[/^Род Барбариенсов/,'img/arms-barbariensy.png'],[/^Род Саксов/,'img/arms-saksy.png']];
const houseArms=n=>{const p=HOUSE_ARMS.find(([r])=>r.test(n));return p?p[1]:null};
const STATE_ART={'Северные_Владыки':'img/art-severnye-vladyki.jpg','Империя':'img/art-imperiya.jpg'}; // эмблема Северных Владык
/* ---------- Герб ---------- */
const CH={
 sun:'<circle cx="50" cy="52" r="13"/><g stroke-width="5" stroke-linecap="round">'+[...Array(8)].map((_,i)=>{const a=i*Math.PI/4,x1=50+Math.cos(a)*19,y1=52+Math.sin(a)*19,x2=50+Math.cos(a)*27,y2=52+Math.sin(a)*27;return `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="currentColor"/>`}).join('')+'</g>',
 flame:'<path d="M50 24c6 12 18 18 16 34-1 11-8 18-16 18s-16-7-16-18c0-8 5-12 8-17 1 6 4 9 7 9-3-9-2-17 1-26z"/>',
 sword:'<path d="M47 22h6v38h-6z"/><path d="M36 58h28v5H36z"/><path d="M47 63h6v10h-6z"/><circle cx="50" cy="77" r="4"/>',
 wave:'<path d="M24 46q6.5-8 13 0t13 0 13 0 13 0v7q-6.5 8-13 0t-13 0-13 0-13 0z"/><path d="M24 62q6.5-8 13 0t13 0 13 0 13 0v7q-6.5 8-13 0t-13 0-13 0-13 0z"/>',
 star:'<path d="M50 24l7 17 18 1-14 11 5 18-16-10-16 10 5-18-14-11 18-1z"/>',
 fang:'<path d="M34 30h32l-6 10-10 38-10-38z"/>',
 tree:'<path d="M50 22l20 26h-9l13 16H54v14h-8V64H26l13-16h-9z"/>',
 tower:'<path d="M36 34h6v6h5v-6h6v6h5v-6h6v12l-4 4v26H40V50l-4-4z"/>',
 crown:'<path d="M28 66l-3-30 13 12 12-18 12 18 13-12-3 30z"/><path d="M28 70h44v6H28z"/>',
 crescent:'<path d="M58 26a26 26 0 1 0 0 52a20 20 0 1 1 0-52z"/>',
 horse:'<path d="M38 76l3-22c-6-2-9-8-7-14l12-12 2-6 5 6c9 4 14 12 14 22l-4 6-6-6-3 4 2 22h-6l-2-18-4 18z"/>',
 none:''
};
function lum(hex){const n=parseInt(hex.slice(1),16);return(.299*(n>>16)+.587*((n>>8)&255)+.114*(n&255))/255}
function arms(st,size){
  if(st&&ARMS_IMG[st.id]){const z=size||64;return `<img class="arms" src="${ARMS_IMG[st.id]}" width="${z}" height="${z}" alt="Герб: ${esc(st.title)}">`}
  const a=st&&st.arms; const f=a?a.field:'#3a3a3a'; const c=lum(f)>.55?'#1c1410':'#e8cf8a';
  const ch=a?(CH[a.charge]||''):'';
  return `<svg viewBox="0 0 100 118" width="${size||64}" aria-hidden="true">
   <defs><linearGradient id="g${size}${st?st.id.length:0}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".18"/><stop offset="1" stop-color="#000" stop-opacity=".25"/></linearGradient></defs>
   <path d="M10 8h80v46c0 30-20 48-40 58C30 102 10 84 10 54z" fill="${f}" stroke="#c8aa6e" stroke-width="5"/>
   <g fill="${c}" style="color:${c}" transform="translate(0 4)">${ch}</g>
   <path d="M10 8h80v46c0 30-20 48-40 58C30 102 10 84 10 54z" fill="url(#g${size}${st?st.id.length:0})"/>
  </svg>`;
}

/* ---------- Люди ---------- */
function initials(n){const p=n.replace(/[«»"()]/g,'').split(/\s+/).filter(w=>/^[А-ЯЁA-Z]/.test(w)&&!/^(Вождь|Королева|Король|Конунг|Стратиот|Великий|Понтифик|Жрица|Архонт)$/.test(w));return(p[0]?p[0][0]:'?')+(p[1]?p[1][0]:'')}
function face(m){const p=portrait(m.name);return p?`<div class="face pic" title="${esc(m.name)}"><img src="${p}" alt="${esc(m.name)}" loading="lazy"></div>`:`<div class="face" title="${esc(m.name)}">${esc(initials(m.name))}</div>`}
function faces(list,max){
  max=max||5; if(!list.length) return '';
  list=[...list].sort((a,b)=>(portrait(b.name)?1:0)-(portrait(a.name)?1:0));
  const shown=list.slice(0,max).map(face).join('');
  return `<div class="faces">${shown}${list.length>max?`<div class="face more">+${list.length-max}</div>`:''}</div>`;
}
const houseMembers=h=>h==null?[]:D.houses[h].members;
const houseName=h=>h==null?'—':D.houses[h].name.replace(/\s*\(.*\)/,'');

/* ---------- Вид ---------- */
let k=1, tx=0, ty=0;
function minK(){return Math.min(innerWidth/MW, innerHeight/MH)*0.95}
function clamp(){
  k=Math.max(minK(),Math.min(k,3));
  const w=MW*k,h=MH*k;
  tx = w<innerWidth ? (innerWidth-w)/2 : Math.min(0,Math.max(innerWidth-w,tx));
  ty = h<innerHeight ? (innerHeight-h)/2 : Math.min(0,Math.max(innerHeight-h,ty));
}
function apply(){
  clamp();
  world.style.transform=`translate(${tx}px,${ty}px) scale(${k})`;
  world.style.setProperty('--inv',(1/k).toFixed(4));
  // масштабная линейка: 1 пиксель подложки ≈ 1 км
  const steps=[10,25,50,100,200,500,1000]; let km=steps.find(s=>s*k>=70)||1000;
  $('#scaleBar').style.width=(km*k)+'px'; $('#scaleTxt').textContent=km+' км';
}
function zoomAt(f,cx,cy){const nk=Math.max(minK(),Math.min(k*f,3)); tx=cx-(cx-tx)*nk/k; ty=cy-(cy-ty)*nk/k; k=nk; apply()}
function centerOn(x,y,nk){
  const pw=$('#panel').classList.contains('open')&&innerWidth>640?Math.min(420,innerWidth):0;
  const ph=$('#panel').classList.contains('open')&&innerWidth<=640?innerHeight*.6:0;
  k=nk||k; tx=(innerWidth-pw)/2-x*k; ty=(innerHeight-ph)/2-y*k; world.style.transition='transform .45s ease'; apply();
  setTimeout(()=>world.style.transition='',460);
}
function fit(){k=minK(); const startK=Math.max(minK(), Math.min(innerWidth/MW*1.0, 0.6)); k=startK; tx=0;ty=0;
  // начальный вид: обжитая часть материка
  centerOn(900,1650,startK)}

/* ---------- Маска областей ---------- */
const mc=document.createElement('canvas'); mc.width=508; mc.height=1024;
let mask=null; const maskImg=new Image(); maskImg.src='regions.png';
maskImg.onload=()=>{const c=mc.getContext('2d'); c.drawImage(maskImg,0,0); mask=c.getImageData(0,0,mc.width,mc.height)};
const hl=$('#hl'); hl.width=508; hl.height=1024; const hctx=hl.getContext('2d'); const hlCache={};
function ridAt(x,y){ if(!mask) return 0; const mx=Math.floor(x/MS), my=Math.floor(y/MS); if(mx<0||my<0||mx>=mask.width||my>=mask.height) return 0; return mask.data[(my*mask.width+mx)*4]; }
function hlFor(rid){
  if(hlCache[rid]) return hlCache[rid];
  const W=mask.width,H=mask.height,src=mask.data,img=hctx.createImageData(W,H),o=img.data;
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){const i=y*W+x; if(src[i*4]!==rid) continue;
    const edge=x===0||y===0||x===W-1||y===H-1||src[(i-1)*4]!==rid||src[(i+1)*4]!==rid||src[(i-W)*4]!==rid||src[(i+W)*4]!==rid;
    const j=i*4; if(edge){o[j]=245;o[j+1]=238;o[j+2]=220;o[j+3]=255}else{o[j]=255;o[j+1]=250;o[j+2]=235;o[j+3]=70}}
  return hlCache[rid]=img;
}
let curRid=0, pinnedRid=0;
function showRegion(rid){
  if(rid===curRid) return; curRid=rid; hctx.clearRect(0,0,hl.width,hl.height);
  document.querySelectorAll('.rlabel.on').forEach(e=>e.classList.remove('on'));
  const r=rid||pinnedRid; if(!r||!mask) return;
  hctx.putImageData(hlFor(r),0,0);
  const el=document.getElementById('rl'+r); if(el) el.classList.add('on');
}

/* ---------- Метки и подписи ---------- */
const labels=$('#labels');
D.provinces.forEach(p=>{const st=stateById[p.state]; const d=document.createElement('div'); d.className='rlabel'; d.id='rl'+p.rid;
  d.style.left=p.cx+'px'; d.style.top=p.cy+'px';
  d.innerHTML=`<div>${arms(st,46)}<span>${esc(p.name.toUpperCase())}</span><small>${esc(st.title)}</small></div>`; labels.appendChild(d)});
const mkWrap=$('#markers'); const mkEls={};
D.settlements.forEach(s=>{const d=document.createElement('div'); d.className='mk'+(s.capital?' cap':''); d.style.left=s.x+'px'; d.style.top=s.y+'px';
  const b=document.createElement('button'); b.setAttribute('aria-label',s.name+', '+s.type); d.appendChild(b); mkWrap.appendChild(d); mkEls[s.name]=d;
  b.addEventListener('pointerenter',e=>{if(e.pointerType==='mouse') showHover(s,b)});
  b.addEventListener('pointerleave',()=>hideHover());
  b.addEventListener('focus',()=>showHover(s,b)); b.addEventListener('blur',hideHover);
  b.addEventListener('click',e=>{e.stopPropagation(); hideHover(); openSettlement(s)});
});

/* ---------- Карточка при наведении ---------- */
const hov=$('#hover');
function showHover(s,el){
  const st=stateById[s.state];
  hov.innerHTML=`<h3>${esc(s.name)}</h3><p>${esc(s.type)} · ${esc(st.title)}</p>${faces(houseMembers(s.house),5)}`;
  hov.hidden=false; const r=el.getBoundingClientRect(); const w=hov.offsetWidth,h=hov.offsetHeight;
  let x=r.right+10, y=r.top+r.height/2-h/2; if(x+w>innerWidth-8) x=r.left-w-10; y=Math.max(8,Math.min(innerHeight-h-8,y));
  hov.style.left=x+'px'; hov.style.top=y+'px';
}
function hideHover(){hov.hidden=true}

/* ---------- Панель ---------- */
const panel=$('#panel'), pbody=$('#pbody');
function openPanel(html,tint){
  pbody.innerHTML=html; pbody.scrollTop=0; panel.style.setProperty('--tint',tint);
  panel.classList.add('open'); panel.setAttribute('aria-hidden','false');
  pbody.querySelectorAll('[data-state]').forEach(b=>b.addEventListener('click',()=>openState(stateById[b.dataset.state],true)));
  pbody.querySelectorAll('[data-set]').forEach(b=>b.addEventListener('click',()=>openSettlement(setByName[b.dataset.set],true)));
}
function closePanel(){panel.classList.remove('open'); panel.setAttribute('aria-hidden','true'); pinnedRid=0; curRid=-1; showRegion(0); selMk(null)}
$('#pClose').addEventListener('click',closePanel);
addEventListener('keydown',e=>{if(e.key==='Escape'){closePanel();$('#results').hidden=true}});
function tintOf(st){const c=st.arms?st.arms.field:st.color||'#c8aa6e'; return c+'55'}
function selMk(name){document.querySelectorAll('.mk.sel').forEach(e=>e.classList.remove('sel')); if(name&&mkEls[name]) mkEls[name].classList.add('sel')}
const rule='<div class="rule"></div>';

function openSettlement(s,fly){
  const st=stateById[s.state]; const h=s.house; const people=houseMembers(h);
  const desc=[s.note&&s.note!=='—'?s.note:''].filter(Boolean).join(' ');
  const extra=[['Тип',s.type],['Состояние',dash(s.status)],['Дороги',dash(s.roads)]];
  openPanel(`
   <div class="phead">${arms(st,64)}<div><h2>${esc(s.name)}</h2><p>${esc(s.type)}${s.capital&&s.type!=='столица'?' · столица':''}</p></div></div>
   ${people.length?faces(people,7):''}
   ${rule}
   <dl class="facts">
     <div><dt>Название</dt><dd>${esc(s.name)}</dd></div>
     <div><dt>Провинция</dt><dd>${esc(dash(s.province))}</dd></div>
     <div><dt>Правитель</dt><dd>${esc(dash(s.ruler))}</dd></div>
     <div><dt>Племя/Дом</dt><dd>${esc(houseName(h))}</dd></div>
     <div><dt>Государство</dt><dd>${st.id==='99_Ничьи_земли'?'Ничьи земли':`<button data-state="${esc(st.id)}">${esc(st.title)}</button>`}</dd></div>
     ${extra.map(([a,b])=>`<div><dt>${a}</dt><dd>${esc(b)}</dd></div>`).join('')}
   </dl>
   ${desc?rule+`<p class="desc">${esc(desc)}</p>`:''}
   ${h!=null?rule+houseBlock(h):''}
   ${st.id!=='99_Ничьи_земли'?`<p><button class="more" data-state="${esc(st.id)}">Узнать больше: ${esc(st.title)} ↗</button></p>`:''}
  `,tintOf(st));
  selMk(s.name); pinnedRid=s.rid; curRid=-1; showRegion(0);
  if(fly) centerOn(s.x,s.y,Math.max(k,1));
}
function houseBlock(h){const H=D.houses[h];
  const ha=houseArms(H.name);
  return `<div class="house"><h5>${ha?`<img class="harms" src="${ha}" alt="" width="26" height="26">`:''}${esc(H.name)}</h5>${H.desc?`<p>${esc(H.desc)}</p>`:''}
    <ul>${H.members.map(m=>`<li>${portrait(m.name)?face(m):''}<div><b>${esc(m.name)}</b>${m.text?` <span>${esc(m.text.replace(/^,\s*/,''))}</span>`:''}</div></li>`).join('')}</ul></div>`}
function openState(st,fly){
  const provs=D.provinces.filter(p=>p.state===st.id);
  const sets=D.settlements.filter(s=>s.state===st.id);
  const people=st.houses.flatMap(h=>D.houses[h].members);
  const cul=st.culture?D.cultures[st.culture]:null;
  const faith=st.faith||(cul?cul.faith:null);
  openPanel(`
   <div class="phead${STATE_ART[st.id]?' art':''}" style="${STATE_ART[st.id]?`--art:url(${STATE_ART[st.id]})`:''}">${arms(st,64)}<div><h2>${esc(st.title)}</h2><p>${esc(st.full!==st.title?st.full.split('·').slice(1).join('·').trim()||st.bloc:st.bloc)}</p></div></div>
   ${faces(people,7)}
   ${rule}
   <dl class="facts">
     <div><dt>Правитель</dt><dd>${esc(dash(st.ruler))}</dd></div>
     <div><dt>Столица</dt><dd>${setByName[st.capital]?`<button data-set="${esc(st.capital)}">${esc(st.capital)}</button>`:esc(dash(st.capital))}</dd></div>
     <div><dt>Блок</dt><dd>${esc(dash(st.bloc))}</dd></div>
     <div><dt>Площадь</dt><dd>${st.area?esc(st.area)+' тыс. км²':'—'}</dd></div>
     <div><dt>Культура</dt><dd>${cul?esc(cul.name):'—'}</dd></div>
     <div><dt>Вера</dt><dd>${faith?esc(faith):'—'}</dd></div>
   </dl>
   ${st.note?rule+`<p class="desc">${esc(st.note)}</p>`:''}
   ${cul?`<p class="desc note">${esc(cul.text)}</p>`:''}
   ${rule}
   <div class="sec"><h4>Поселения</h4><p class="desc">${sets.map(s=>`<button class="more" data-set="${esc(s.name)}">${s.capital?'★ ':''}${esc(s.name)}</button>`).join(' · ')}</p></div>
   ${st.chronicle.length?rule+`<div class="sec"><h4>Хроника</h4><ul class="chron">${st.chronicle.map(c=>{const m=c.match(/^(\d+):\s*(.*)$/);return m?`<li><b>${m[1]}</b><span>${esc(m[2])}</span></li>`:`<li><b></b><span>${esc(c)}</span></li>`}).join('')}</ul></div>`:''}
   ${st.houses.length?rule+`<div class="sec"><h4>Дома и рода</h4>${st.houses.map(houseBlock).join('')}</div>`:''}
   ${st.neighbors?rule+`<div class="sec"><h4>Соседи</h4><p class="desc">${esc(st.neighbors)}</p></div>`:''}
   <p class="src">Сведения из сводок проекта: государства, персонажи, культура.</p>
  `,tintOf(st));
  selMk(null); pinnedRid=provs[0]?provs[0].rid:0; curRid=-1; showRegion(0);
  if(fly&&provs[0]) centerOn(provs[0].cx,provs[0].cy);
}

/* ---------- Перетаскивание, масштаб ---------- */
const ptrs=new Map(); let moved=false, pinch0=null, last=null;
stage.addEventListener('pointerdown',e=>{if(e.target.closest('.mk')) return; stage.setPointerCapture(e.pointerId); ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY}); moved=false; last={x:e.clientX,y:e.clientY};
  if(ptrs.size===2){const [a,b]=[...ptrs.values()]; pinch0={d:Math.hypot(a.x-b.x,a.y-b.y),k}} });
stage.addEventListener('pointermove',e=>{
  if(ptrs.has(e.pointerId)){
    const p=ptrs.get(e.pointerId); const dx=e.clientX-p.x, dy=e.clientY-p.y; ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(ptrs.size===1){ if(Math.abs(e.clientX-last.x)+Math.abs(e.clientY-last.y)>4){moved=true; stage.classList.add('dragging')} tx+=dx; ty+=dy; apply(); }
    else if(ptrs.size===2&&pinch0){moved=true; const [a,b]=[...ptrs.values()]; const d=Math.hypot(a.x-b.x,a.y-b.y); zoomAt(pinch0.k*d/pinch0.d/k,(a.x+b.x)/2,(a.y+b.y)/2)}
    return;
  }
  if(e.pointerType!=='mouse') return;
  const x=(e.clientX-tx)/k, y=(e.clientY-ty)/k; showRegion(e.target.closest('.mk')?curRid:ridAt(x,y));
});
function up(e){ if(!ptrs.has(e.pointerId)) return; ptrs.delete(e.pointerId); if(ptrs.size<2) pinch0=null; stage.classList.remove('dragging');
  if(!moved&&ptrs.size===0){ const x=(e.clientX-tx)/k, y=(e.clientY-ty)/k; const r=ridAt(x,y); const p=provByRid[r];
    if(p){ openState(stateById[p.state]); pinnedRid=r; curRid=-1; showRegion(r) } else closePanel(); }
}
stage.addEventListener('pointerup',up); stage.addEventListener('pointercancel',up);
stage.addEventListener('pointerleave',()=>{curRid=-1; showRegion(0)});
stage.addEventListener('wheel',e=>{e.preventDefault(); zoomAt(Math.exp(-e.deltaY*0.0015),e.clientX,e.clientY)},{passive:false});
stage.addEventListener('dblclick',e=>zoomAt(1.8,e.clientX,e.clientY));
$('#zIn').onclick=()=>zoomAt(1.4,innerWidth/2,innerHeight/2);
$('#zOut').onclick=()=>zoomAt(1/1.4,innerWidth/2,innerHeight/2);
addEventListener('resize',apply);

/* ---------- Слои ---------- */
function setLayer(phys){$('#imgPhys').style.opacity=phys?1:0; $('#tPhys').setAttribute('aria-pressed',phys); $('#tPol').setAttribute('aria-pressed',!phys)}
$('#tPol').onclick=()=>setLayer(false); $('#tPhys').onclick=()=>setLayer(true);
$('#tMk').onclick=()=>{const on=stage.classList.toggle('show-mk'); $('#tMk').setAttribute('aria-pressed',on)};

/* ---------- Поиск ---------- */
const q=$('#q'), res=$('#results');
const index=[...D.settlements.map(s=>({t:s.name,sub:s.type+' · '+(stateById[s.state].id==='99_Ничьи_земли'?'ничьи земли':stateById[s.state].title),hay:(s.name+' '+s.ruler).toLowerCase(),go:()=>openSettlement(s,true)})),
  ...D.states.filter(s=>s.id!=='99_Ничьи_земли').map(s=>({t:s.title,sub:'владение',hay:(s.full+' '+s.ruler).toLowerCase(),go:()=>openState(s,true)})),
  ...D.houses.flatMap(h=>h.members.map(m=>{const st=D.states.find(s=>s.houses.includes(D.houses.indexOf(h)));return st?{t:m.name,sub:h.name.replace(/\s*\(.*\)/,''),hay:m.name.toLowerCase(),go:()=>openState(st,true)}:null}).filter(Boolean))];
q.addEventListener('input',()=>{const v=q.value.trim().toLowerCase(); if(v.length<2){res.hidden=true;return}
  const hits=index.filter(i=>i.hay.includes(v)).slice(0,12);
  res.innerHTML=hits.length?hits.map((h,i)=>`<li><button data-i="${index.indexOf(h)}"><span>${esc(h.t)}</span><small>${esc(h.sub)}</small></button></li>`).join(''):'<li><button disabled><span>Ничего не найдено</span></button></li>';
  res.hidden=false; res.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>{index[+b.dataset.i].go(); res.hidden=true; q.blur()})});
q.addEventListener('keydown',e=>{if(e.key==='Enter'){const b=res.querySelector('[data-i]'); if(b) b.click()}});
document.addEventListener('pointerdown',e=>{if(!e.target.closest('.search')) res.hidden=true});

fit();
})();
</script>
